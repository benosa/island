# Размер острова (клетки)
island.rows=10
island.cols=50

# Длительность одного такта (мс) и максимум тактов
simulation.tickDurationMs=1000
simulation.maxTicks=200

# Условие остановки: ALL_DEAD (все животные умерли) или MAX_TICKS (по тактам)
simulation.stopCondition=ALL_DEAD

# глобальный лимит животных на всём острове (0 = без лимита)
simulation.maxAnimals=2000

# Коэффициент роста растений за такт
plant.growthRate=1.1
plant.maxPerCell=30

# Максимальное количество на одной клетке
animal.maxPerCell.Wolf=3
animal.maxPerCell.Snake=3
