# Размер острова (клетки)
island.rows=20
island.cols=100

# Длительность одного такта (мс) и максимум тактов
simulation.tickDurationMs=500
simulation.maxTicks=200

# Условие остановки: ALL_DEAD (все животные умерли) или MAX_TICKS (по тактам)
simulation.stopCondition=ALL_DEAD

# Коэффициент роста растений за такт
plant.growthRate=1.5
plant.maxPerCell=200

